[Control]
# ControlMethod: Method used to control the fan speed.
# Allowed values:
#   - "Step": Adjusts fan speed in discrete steps.
#   - "Linear": Gradually adjusts fan speed based on temperature.
# Default: "Step"
ControlMethod=Step

[Hardware]
# ThermalZone: The hardware thermal zone to monitor.
# Typically corresponds to a temperature sensor.
# Allowed values: Any valid thermal zone ID (e.g., 0, 1, 2, etc.).
# Default: 0 (usually the CPU temperature zone).
ThermalZone=0

# PWMChannel: The Pulse Width Modulation (PWM) channel controlling the fan.
# Allowed values: 0 (default) or other valid PWM channels on your system.
# Default: 0
PWMChannel=0

# PWMPeriod: The PWM period (in nanoseconds) defining the frequency of the signal.
# Affects the fan's performance and speed:
#   - Lower values increase the frequency and provide smoother fan speed transitions but may reduce the range of achievable fan speeds.
#   - Higher values decrease the frequency, potentially making fan control less precise but increasing speed range.
# Standard default value for PWM period: 20000000 ns (20 ms).
# Allowed values: Any positive integer (commonly in the range of 1000000 to 20000000 for most fans).
# Default: 20000000
# PWMPeriod=20000000

[Network]
# NetworkPort: The port number the Fan Controller Daemon uses for network communication.
# Allowed values: Any valid port number (1–65535).
# Common range: 1024–49151 (to avoid conflicts with reserved or dynamic ports).
# Default: 8688
NetworkPort=8688